name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests
      - name: Shell syntax
        run: bash -n scripts/amd/*.sh scripts/cloud/*.sh
      - name: Python resolver smoke
        run: bash -lc 'source scripts/amd/common.sh; p="$(resolve_physground_python)"; print_python_identity "$p"'
      - name: Unit tests
        run: python -m pytest --ignore=tests/test_acceptance.py
      - name: Benchmark smoke
        run: physground benchmark --methods oracle,nominal,fisher,physground --limit 4 --output /tmp/pushbench-smoke.json
      - name: Dataset generation smoke
        run: physground generate-data --backend reduced --records 128 --shard-size 64 --output-dir /tmp/physground-data
      - name: Compile
        run: python -m compileall -q src

  benchmark-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Full reference benchmark gate
        run: physground benchmark --require-pass --output /tmp/pushbench.json
