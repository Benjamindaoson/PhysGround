name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests
      - name: Unit tests
        run: python -m pytest --ignore=tests/test_acceptance.py
      - name: Benchmark smoke
        run: physground benchmark --methods oracle,nominal,fisher,physground --limit 4 --output /tmp/pushbench-smoke.json
      - name: Compile
        run: python -m compileall -q src

  benchmark-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Full reference benchmark gate
        run: physground benchmark --require-pass --output /tmp/pushbench.json
