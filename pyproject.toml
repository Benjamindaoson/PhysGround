[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "physground"
version = "0.1.0"
description = "Decision-relevant system identification and selective probing for contact-rich manipulation."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
opt = ["scipy>=1.11", "cma>=4.0"]
jax = ["jax>=0.4.35"]
mujoco = ["mujoco>=3.2"]
viz = ["matplotlib>=3.8"]

[project.scripts]
physground = "physground.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
